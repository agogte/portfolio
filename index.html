    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ag-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0D0D0F");
          }
        } catch (e) {}
      })();
    </script>
